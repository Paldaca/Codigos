<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cereipo · Códigos{% endblock %}</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 24px;">
    <div style="max-width: 600px; margin: auto; background-color: #ffffff; padding: 28px; border-radius: 10px; border: 1px solid #e2e8f0;">
        {% block content %}{% endblock %}
        <hr style="margin: 28px 0; border: none; border-top: 1px solid #e2e8f0;">
        <p style="font-size: 12px; color: #64748b; text-align: center;">
            Notificación automática de Cereipo · Códigos.
        </p>
    </div>
</body>
</html>
