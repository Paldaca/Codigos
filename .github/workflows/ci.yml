name: CI

on:
  push:
    branches: [Cereipo, dev, main]
  pull_request:
    branches: [Cereipo, dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (check, import-linter y pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-sin-secreto
      DATABASE_URL: postgres://codigos:ci@127.0.0.1:5432/cereipo_ci
      REDIS_URL: redis://127.0.0.1:6379/2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Acceso al kit privado (cereipo-sso)
        env:
          TOKEN: ${{ secrets.CEREIPO_KIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto CEREIPO_KIT_TOKEN."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/Paldaca/Cereipo-Kit".insteadOf "https://github.com/Paldaca/Cereipo-Kit"
      - run: pip install -r ../requirements.txt -r ../requirements-dev.txt
      - name: Rol sin privilegios para probar RLS (D-27)
        env:
          PGPASSWORD: ci
        run: psql -h 127.0.0.1 -U postgres -c "CREATE ROLE codigos LOGIN PASSWORD 'ci' CREATEDB NOSUPERUSER NOBYPASSRLS"
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: lint-imports
      - run: python manage.py test

  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          if [ -z "${{ secrets.CEREIPO_KIT_TOKEN }}" ]; then
            echo "::error::Falta el secreto CEREIPO_KIT_TOKEN."
            exit 1
          fi
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.CEREIPO_KIT_TOKEN }}" >> .npmrc
          npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  imagen:
    name: Imagen y despliegue (D-36)
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=pruebas,enable=${{ github.ref == 'refs/heads/Cereipo' }}
            type=raw,value=produccion,enable=${{ github.ref == 'refs/heads/Main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          secrets: |
            kit_token=${{ secrets.CEREIPO_KIT_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
